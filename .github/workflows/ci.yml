name: CI

# Everything a reviewer would otherwise have to take on trust. The suite has
# only ever run on a developer's machine, and a green suite that runs nowhere
# else is one commit away from being red without anyone noticing.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The render and quality suites shell out to real ffmpeg and measure the
      # files it produces. Mocking it would only test the mock.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-asyncio
          python -m pip install -e workers/_sdk

      - run: ruff check workers/ tests/gpu/
      - run: python -m pytest tests/gpu -q

  guardrails:
    # The two rules the whole architecture rests on: nothing generates through
    # an external provider, and nothing is pinned to one host. Run separately
    # so a failure here is unmistakable rather than one line in a long log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm test:portability
